[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-ca-benchmark"
version = "0.3.1"
description = "Mapless asymptotic route-length benchmark and sanity checker for vehicle routing / field-sales visit scheduling, based on Daganzo continuous approximation and the BHH theorem."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ghb" }]
keywords = [
    "VRP",
    "TSP",
    "continuous approximation",
    "Daganzo",
    "BHH",
    "logistics",
    "route length benchmark",
    "data sanity check",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "coords-core @ git+https://github.com/topprismdata/coords-core.git@v0.1.0",
]

[project.scripts]
spatial-ca = "spatial_ca.cli:main"

[tool.setuptools]
packages = ["spatial_ca"]
